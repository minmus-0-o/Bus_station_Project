<!DOCTYPE html>
<html>
<head>
    <title>Оформление заказа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Оформление заказа</h1>
        <p>Рейс: {{ trip.origin }} - {{ trip.destination }} ({{ trip.departure_time }})</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="tickets_count" class="form-label">Количество билетов</label>
                <input type="number" class="form-control" id="tickets_count" name="tickets_count" min="1" max="{{ trip.seats_available }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Оформить заказ</button>
            <a href="{% url 'trip_list' %}" class="btn btn-secondary">Назад</a>
        </form>
    </div>
</body>
</html>
