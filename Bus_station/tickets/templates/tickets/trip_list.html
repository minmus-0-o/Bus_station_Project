<!DOCTYPE html>
<html>
<head>
    <title>Автовокзал</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Доступные рейсы</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Откуда</th>
                    <th>Куда</th>
                    <th>Время отправления</th>
                    <th>Цена</th>
                    <th>Места</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody>
                {% for trip in trips %}
                <tr>
                    <td>{{ trip.origin }}</td>
                    <td>{{ trip.destination }}</td>
                    <td>{{ trip.departure_time }}</td>
                    <td>{{ trip.price }} руб.</td>
                    <td>{{ trip.seats_available }}</td>
                    <td><a href="{% url 'create_order' trip.id %}" class="btn btn-primary">Купить</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
