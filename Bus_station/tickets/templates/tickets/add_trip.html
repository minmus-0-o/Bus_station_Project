<!DOCTYPE html>
<html>
<head>
    <title>Добавить рейс</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Добавить новый рейс</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="origin" class="form-label">Пункт отправления</label>
                {{ form.origin }}
            </div>
            <div class="mb-3">
                <label for="destination" class="form-label">Пункт назначения</label>
                {{ form.destination }}
            </div>
            <div class="mb-3">
                <label for="departure_time" class="form-label">Время отправления</label>
                {{ form.departure_time }}
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Цена (руб.)</label>
                {{ form.price }}
            </div>
            <div class="mb-3">
                <label for="seats_available" class="form-label">Доступные места</label>
                {{ form.seats_available }}
            </div>
            <div class="mb-3">
                <label for="company" class="form-label">Транспортная компания</label>
                {{ form.company }}
            </div>
            <button type="submit" class="btn btn-primary">Добавить рейс</button>
            <a href="{% url 'trip_list' %}" class="btn btn-secondary">Назад</a>
        </form>
        <form action="{% url 'logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger mt-3">Выйти</button>
        </form>
    </div>
</body>
</html>
